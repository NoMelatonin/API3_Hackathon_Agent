[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["vendor"]
solc_version = "0.8.37"
optimizer = true
additional_compiler_profiles = [{ name = "via-ir", via_ir = true }]
compilation_restrictions = [
  { paths = "contracts/DisasterFundV3Auto.sol", via_ir = true },
  { paths = "contracts/DemoUSDV3.sol", via_ir = true },
]
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=vendor/openzeppelin-contracts/contracts/",
  "forge-std/=vendor/forge-std/src/",
  "solady/=vendor/solady/src/",
]
fs_permissions = [{ access = "read", path = "./fixtures" }, { access = "read", path = "./test/fixtures" }]
ignored_warnings_from = ["vendor"]

[profile.default.fuzz]
runs = 1000

[fmt]
line_length = 120
